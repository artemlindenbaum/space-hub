name: ui_kit
description: "A new Flutter package project."
version: 0.0.1

environment:
  sdk: ^3.10.1
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.3

  # Internationalization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  intl_utils: ^2.8.13
  build_runner: ^2.10.4
  flutter_gen_runner: ^5.12.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/svg/

  fonts:
    - family: WixMadeforDisplay
      fonts:
        - asset: assets/fonts/WixMadeforDisplay-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/WixMadeforDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/WixMadeforDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/WixMadeforDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/WixMadeforDisplay-Regular.ttf
          weight: 400

flutter_gen:
  output: lib/src/assets_gen
  line_length: 80
  integrations:
    flutter_svg: true

flutter_intl:
  enabled: true
  class_name: S
  main_locale: en
  arb_dir: lib/src/localization
  output_dir: lib/src/localization/generated
